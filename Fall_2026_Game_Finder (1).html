const el=id=>document.getElementById(id);

function formatDate(s){let d=new Date(s+' 12:00:00');return isNaN(d)?s:new Intl.DateTimeFormat('en-US',{weekday:'short',month:'numeric',day:'numeric'}).format(d)}
